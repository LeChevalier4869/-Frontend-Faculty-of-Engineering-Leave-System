server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: ทุก path ที่ไม่ใช่ไฟล์จริง ให้ตกมาที่ index.html (React Router จัดการ route เอง)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # cache ไฟล์ asset ที่มี hash ในชื่อ (เปลี่ยนทุก build) ได้ยาวๆ
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
